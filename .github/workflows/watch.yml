name: Controllo Pokémon

# Parte ogni ora grazie a cron-job.org (che chiama "Run workflow") e, come riserva, al timer di GitHub.
on:
  schedule:
    - cron: "17 * * * *"   # ogni ora, al minuto 17
  workflow_dispatch:
    inputs:
      riepilogo:
        description: "Manda anche il riepilogo completo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: controllo-pokemon
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ref: main = parte sempre dallo stato più recente, anche se il giro era in coda dietro un altro
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Controlla i negozi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.riepilogo }}
        run: python watch.py
      - name: Salva lo stato
        if: always()
        run: |
          git config user.name "robot-pokemon"
          git config user.email "robot-pokemon@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          [ -d docs ] && git add docs
          git diff --cached --quiet && exit 0
          git commit -m "stato $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1  # stato non salvato: meglio vedere il giro in rosso su GitHub
